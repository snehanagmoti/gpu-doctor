name: Bug report
description: gpu-doctor gave a wrong, missing or confusing diagnosis, or crashed
labels: [bug]
body:
  - type: textarea
    id: report
    attributes:
      label: Output of `gpu-doctor --report`
      description: Hostname, username, UUIDs and serial numbers are redacted automatically.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: For example "my GPU works but secure_boot says FAIL", or "it missed that nouveau was loaded".
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install gpu-doctor?
      options: [PPA (.deb), Snap, From source / pip]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: What you ran to fix it, if you did; links to AskUbuntu threads.
