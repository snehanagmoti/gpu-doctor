name: Release

# Publish a release on GitHub (Releases -> Draft a new release, tag v0.1.0)
# and this builds the packages and attaches them to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version
        run: |
          version=$(python3 -c 'import sys; sys.path.insert(0, "src"); import gpudoctor; print(gpudoctor.__version__)')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build the Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python python3-all python3-setuptools python3-pytest \
            devscripts lintian fakeroot
          ./scripts/build-deb.sh "$PWD/build-area"
      - uses: snapcore/action-build@v1
        id: snap
      - name: Build the Python sdist and wheel
        run: |
          pip install build
          python3 -m build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build-area/*.deb
            build-area/*.orig.tar.gz
            ${{ steps.snap.outputs.snap }}
            dist/*
