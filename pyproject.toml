[build-system]
# 59 is the setuptools version in Ubuntu 22.04; anything newer works too.
requires = ["setuptools>=59"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade, aimed at 3.10
    "SIM",     # simplifications
    "RUF",     # ruff-specific
]

[tool.ruff.lint.isort]
# Helper modules that live next to the tests.
known-local-folder = ["fsbuilder", "scenarios"]

[tool.mypy]
python_version = "3.10"
strict = true
# Product code is checked strictly; tests are plain pytest functions and are
# validated by running them.
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import gpudoctor from src/ without installing it (needs pytest >= 7;
# packaging builds and autopkgtest use the built/installed copy instead).
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["gpudoctor"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
