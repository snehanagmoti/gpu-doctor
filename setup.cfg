# Project metadata lives here (declarative setuptools config) rather than in a
# PEP 621 [project] table in pyproject.toml, because Ubuntu 22.04 (jammy) ships
# python3-setuptools 59.x, and [project] support only arrived in setuptools 61.
# setup.cfg works on every setuptools from jammy's 59 up to noble's 68 and beyond.

[metadata]
name = gpu-doctor
version = attr: gpudoctor.__version__
description = Read-only diagnostics for NVIDIA driver and CUDA setups on Ubuntu
long_description = file: README.md
long_description_content_type = text/markdown
author = Sneha Nagmoti
author_email = snehanagmoti2004@gmail.com
url = https://github.com/snehanagmoti/gpu-doctor
license = GPL-3.0-or-later
license_files = LICENSE
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: System Administrators
    License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: System :: Hardware
    Topic :: System :: Systems Administration

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
# No runtime dependencies on purpose: stdlib only keeps the .deb and snap trivial.
install_requires =

[options.packages.find]
where = src

[options.package_data]
gpudoctor = data/*.json

[options.entry_points]
console_scripts =
    gpu-doctor = gpudoctor.cli:main
